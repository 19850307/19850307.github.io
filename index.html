<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>19850307.xyz — under construction</title>

    <meta name="description" content="19850307.xyz is being rebuilt. Check back soon." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f3f2ed" />
    <link rel="canonical" href="https://19850307.xyz/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="19850307.xyz" />
    <meta property="og:title" content="19850307.xyz — under construction" />
    <meta property="og:description" content="The site is being rebuilt. Check back soon." />
    <meta property="og:url" content="https://19850307.xyz/" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <span>sys://19850307</span>
      <span class="topbar__mid">[ maintenance ]</span>
      <span><i class="led" aria-hidden="true"></i>online</span>
    </header>

    <main class="stage">
      <img
        class="wordmark"
        src="wordmark.svg"
        width="720"
        height="80"
        alt="19850307.xyz"
      />

      <p class="tagline">// site under construction //</p>
      <p class="sub">
        The old notes are offline for now while the site is rebuilt. Check back
        soon.
      </p>

      <div
        class="bar"
        role="progressbar"
        aria-label="Build progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="35"
      >
        <div class="bar__fill"></div>
      </div>

      <p class="status">
        loading units <span id="percent">35</span>%
        <span class="status__cursor" aria-hidden="true">▌</span>
      </p>
    </main>

    <footer class="foot foot--single">
      <span id="copyright">© 19850307.xyz</span>
    </footer>

    <script>
      (function () {
        var copyright = document.getElementById("copyright");
        if (copyright) {
          copyright.textContent = "© " + new Date().getFullYear() + " 19850307.xyz";
        }

        var fill = document.querySelector(".bar__fill");
        var percent = document.getElementById("percent");
        var bar = document.querySelector(".bar");
        if (!fill || !percent) return;

        var value = 35;
        window.setInterval(function () {
          value += 7;
          if (value > 100) value = 0;
          fill.style.width = value + "%";
          percent.textContent = (value < 10 ? "0" : "") + value;
          if (bar) bar.setAttribute("aria-valuenow", String(value));
        }, 450);
      })();
    </script>
  </body>
</html>
